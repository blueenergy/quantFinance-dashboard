name: Frontend CI

on:
  push:
    branches: [ main, master, develop, fix_* ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # required for ghcr.io push

jobs:
  test-build:
    name: Test & Build (Vite + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'
      - name: Install dependencies (ci)
        run: npm ci
      - name: Run unit tests
        run: npm test -- --coverage=false
      - name: Build
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: dist/
      - name: Upload build metadata (optional)
        if: always()
        run: |
          echo "Commit: $GITHUB_SHA" > build_info.txt
          echo "Date: $(date -u)" >> build_info.txt
          echo "Branch: $GITHUB_REF" >> build_info.txt
      - name: Artifact build info
        uses: actions/upload-artifact@v6
        with:
          name: build-info
          path: build_info.txt

  e2e-smoke:
    name: Playwright Smoke (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.4'
          cache: 'npm'
      - name: Install dependencies (ci)
        run: npm ci
      - name: Download dist artifact
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: dist/
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run smoke e2e
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-build:
    name: Build & Push Docker image (ghcr.io)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-build, e2e-smoke]
    runs-on: ubuntu-latest
    # A registry push has no timeout of its own. On 2026-09-21 a sibling repo
    # lost 3h36m to one that stalled after the build had finished, and a
    # stalled job here blocks release (needs: below) the same way. The ACR leg
    # no longer runs in CI (host/mirror_to_acr.sh relays instead), so this
    # guards the ghcr leg. A healthy cold build is ~10 min and a warm one ~2,
    # so 20 fails fast without false alarms.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/blueenergy/quant-dashboard
          # Final tags now come straight from this job — the manifest job that
          # used to merge the per-arch tags is gone, so no -amd64/-arm64 suffix.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fast
          # arm64 had no consumer: nothing in quant-infrastructure pins a
          # platform, every target is x86_64, and the relay only mirrors amd64.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the amd64 scope so the existing cache still hits; the arm64
          # scope is simply abandoned.
          cache-from: type=gha,scope=build-amd64
          cache-to: type=gha,mode=max,scope=build-amd64
          build-args: |
            VITE_API_BASE=/api

  release:
    name: Bump image tag in quant-infrastructure & trigger deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Checkout, wait for the relay, bump, one dispatch POST. The wait has its
    # own 45-minute ceiling (the ghcr->ACR relay sweeps on a timer and a cold
    # cross-border pull is slow), so the job ceiling sits above it. A healthy
    # run is about a minute.
    timeout-minutes: 50
    needs: [test-build, docker-build]
    steps:
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout app repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout quant-infrastructure
        uses: actions/checkout@v6
        with:
          repository: blueenergy/quant-infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Wait for the tag to reach ACR
        # CI publishes to ghcr only. host/mirror_to_acr.sh on the host relays
        # each sha-* tag into ACR, and the deploy targets pull from there, so
        # the bump below must not happen until the tag is actually readable.
        # Failing here is deliberate: a relay that has stopped working has to
        # surface as a red run and a DingTalk alert, not as a deploy that
        # quietly cannot pull its image.
        env:
          ACR_REGISTRY: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          ACR_REPO: wukongquant/quant-dashboard
          TAG: ${{ steps.tag.outputs.tag }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
        run: bash infra/scripts/wait-for-acr-tag.sh

      - name: Bump versions.env with release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KEY: QUANT_DASHBOARD_IMAGE_TAG
          DEPLOY_LABEL: quant-web
          SOURCE_REPO: ${{ github.repository }}
          NEW_SHA: ${{ github.sha }}
          APP_REPO_DIR: ${{ github.workspace }}
          INFRA_DIR: ${{ github.workspace }}/infra
          SERVICES: quant-web
        run: bash infra/scripts/bump-versions-env.sh

      - name: Trigger centralized deploy
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${INFRA_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/blueenergy/quant-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"services\":\"quant-web\",\"tag\":\"${TAG}\"}}"

  notify-dingtalk:
    name: Notify DingTalk on failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [test-build, e2e-smoke, docker-build, release]
    uses: blueenergy/quant-infrastructure/.github/workflows/notify-dingtalk.yml@main
    secrets:
      DATA_CONTRACT_WEBHOOK_URL: ${{ secrets.DATA_CONTRACT_WEBHOOK_URL }}
      DATA_CONTRACT_WEBHOOK_SECRET: ${{ secrets.DATA_CONTRACT_WEBHOOK_SECRET }}
    with:
      workflow: ${{ github.workflow }}
      needs_json: ${{ toJSON(needs) }}
